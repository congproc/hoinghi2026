<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hội nghị Tổng kết 2026</title>
<style>
:root { color-scheme: light; --bg: #f4f4f2; --text: #0b0b0b; --text-2: #52514e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #121211; --text: #f0efec; --text-2: #c3c2b7; } }
:root[data-theme="dark"] { color-scheme: dark; --bg: #121211; --text: #f0efec; --text-2: #c3c2b7; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
  background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
h1 { font-size: 20px; margin: 0 0 6px; }
p { margin: 0; color: var(--text-2); }
</style>
</head>
<body>
<main>
  <h1>Hội nghị Tổng kết 2026</h1>
  <p>Trang check-in sẽ mở vào ngày 22/12/2026.</p>
</main>
</body>
</html>
