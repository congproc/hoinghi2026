<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Màn hình chào mừng · mô phỏng LED</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; background: #00192f; box-shadow: 0 0 0 1px #1c2c3c; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #hint { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace; color: #7fa6c4; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; transition: opacity .5s; pointer-events: none; }
  #hint.off { opacity: 0; }
</style>
</head>
<body>
<div id="stage"><iframe id="f" title="Màn hình chào mừng" allow="fullscreen"></iframe></div>
<div id="hint"></div>
<script>
(function () {
  // Shows the welcome screen on a canvas with the exact LED wall shape (5.10 m x 2.56 m = 2040 x 1024 px at P2.5),
  // scaled to fit this window with black bars. ?w=1920&h=964 picks another canvas. Keys: F fullscreen, H hide/show this note.
  var q = new URLSearchParams(location.search);
  var W = Number(q.get('w')) || 2040, H = Number(q.get('h')) || 1024;
  var stage = document.getElementById('stage'), f = document.getElementById('f'), hint = document.getElementById('hint');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  var inner = new URLSearchParams(location.search); inner.delete('w'); inner.delete('h');
  f.src = './' + (inner.toString() ? '?' + inner.toString() : '');
  var timer;
  function fit() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = 'scale(' + s + ') translate(-50%, -50%)';
    hint.textContent = W + ' × ' + H + ' px (tỉ lệ ' + (W / H).toFixed(3) + ' : 1) · hiển thị ' + Math.round(s * 100) + '% · F = toàn màn hình · H = ẩn ghi chú';
  }
  addEventListener('resize', fit); fit();
  function flash() { hint.classList.remove('off'); clearTimeout(timer); timer = setTimeout(function () { hint.classList.add('off'); }, 4000); }
  flash();
  addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function () {}); else document.exitFullscreen(); }
    if (k === 'h') { hint.classList.toggle('off'); }
  });
  // keys pressed while the iframe has focus
  f.addEventListener('load', function () { try { f.contentWindow.addEventListener('keydown', function (e) { if (e.key.toLowerCase() === 'h') hint.classList.toggle('off'); }); } catch (e) {} });
})();
</script>
</body>
</html>
