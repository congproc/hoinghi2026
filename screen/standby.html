<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Màn hình dự phòng · Hội nghị 2026</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 6vmin;
      text-align: center;
      background: radial-gradient(ellipse at 50% 30%, #065b91, #001a30 80%);
      color: #fff;
      font: 600 clamp(15px, 3vmin, 36px)/1.35 system-ui, sans-serif;
    }
    img { width: clamp(68px, 13vmin, 180px); height: auto; border-radius: 50%; }
    h1 { max-width: 24ch; margin: .25em auto; font-size: clamp(26px, 7vmin, 100px); line-height: 1.2; }
    .welcome { margin: .9em 0 0; color: #fff200; text-transform: uppercase; letter-spacing: .12em; }
    .date { color: #cfe9ff; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/logo.png" alt="Saigontourist Travel">
    <p class="welcome">Chào mừng Quý Anh Chị</p>
    <h1>Hội nghị Tổng kết Hoạt động Kinh doanh 2026</h1>
    <p>Phương hướng 2027 · Gala Dinner</p>
    <p class="date">22.12.2026</p>
  </main>
</body>
</html>
